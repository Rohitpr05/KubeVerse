# Validation is an independently deployable workload that pulls from the local registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation
  namespace: k8s-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation
  template:
    metadata:
      labels:
        app: validation
    spec:
      containers:
        - name: validation
          image: localhost:5000/k8s-dockersimulator-validation:latest
          # The application tag is deliberately mutable for local learning, so always fetch it on Pod creation.
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
          livenessProbe:
            httpGet: { path: /live, port: 3001 }
