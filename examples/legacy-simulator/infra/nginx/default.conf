# Nginx is the single host-facing entry point and keeps service ports on the Compose network.
upstream gateway_api {
    server gateway:3000;
}

# Continue a caller's trace when it exists; generate one only at the edge when absent.
map $http_x_request_id $trace_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx"}';
    }

    location / {
        proxy_pass http://gateway_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $trace_request_id;
    }
}
