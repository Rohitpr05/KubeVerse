<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KubeVerse</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; background: #0b1220; color: #f1f5f9; font-family: system-ui, sans-serif; }
  .logo { width: 72px; height: 72px; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: .01em; }
  .tagline { margin: -12px 0 0; color: #9eafc3; font-size: .78rem; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #314258; border-top-color: #38bdf8; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p.status { color: #9eafc3; font-size: 0.85rem; margin: 0; }
</style>
</head>
<body>
  <!-- Official KubeVerse icon-tile mark (branding/kubeverse-icon-tile.svg), inlined so
       this standalone loading screen has no external asset path to resolve. -->
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KubeVerse">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#0F2444"></rect>
    <g transform="translate(9.6 9.6) scale(0.7)">
      <g fill="none" stroke="#FFFFFF" stroke-width="2.42">
        <path d="M17 15V49"></path>
        <path d="M17 32L45 15"></path>
        <path d="M17 32L45 49"></path>
      </g>
      <g fill="#FFFFFF">
        <circle cx="17" cy="15" r="4.2"></circle>
        <circle cx="17" cy="49" r="4.2"></circle>
        <circle cx="45" cy="15" r="4.2"></circle>
        <circle cx="45" cy="49" r="4.2"></circle>
      </g>
      <circle cx="17" cy="32" r="6.6" fill="#3B82C4"></circle>
    </g>
  </svg>
  <h1>KubeVerse</h1>
  <p class="tagline">Local Kubernetes Development Environment</p>
  <div class="spinner"></div>
  <p class="status">Starting local services…</p>
</body>
</html>
