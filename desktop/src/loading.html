<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KubeVerse</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: #0b1220; color: #f1f5f9; font-family: system-ui, sans-serif; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #314258; border-top-color: #38bdf8; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #9eafc3; font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>Starting KubeVerse…</p>
</body>
</html>
